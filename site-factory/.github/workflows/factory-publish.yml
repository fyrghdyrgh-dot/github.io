name: Auto Publish Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Factory Cycle
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npm run cycle
